[project]
name = "sts2-runner"
dynamic = ["version"]
description = "Slay the Spire 2 run parser and reporting toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas",
  "polars",
  "tqdm",
  "streamlit",
  "matplotlib",
  "plotly",
  "pillow",
  "fastapi",
  "uvicorn",
  "pytest",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
  "ruff",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/sts2"]

[tool.ruff]
line-length = 300
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]
ignore = ["W191"]

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
line-ending = "lf"
skip-magic-trailing-comma = true